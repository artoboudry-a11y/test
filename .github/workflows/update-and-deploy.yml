name: Robot TradePilot — données & déploiement

on:
  push:
    branches: ['**']
  schedule:
    # Toutes les 30 min pendant les heures de marché (lun-ven), UTC.
    - cron: '*/30 6-21 * * 1-5'
    # Une passe quotidienne le week-end.
    - cron: '15 6 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tradepilot-robot
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests unitaires (indicateurs)
        run: node scripts/test_indicators.mjs

      - name: Test d'intégration (pipeline actions, réseau simulé)
        run: node scripts/test_fetch_stocks.mjs

      - name: Tests de fumée de l'appli (nominal + panne Binance)
        run: |
          node scripts/test_app_smoke.mjs
          FAIL_BINANCE=1 node scripts/test_app_smoke.mjs

      - name: Récupération des données boursières réelles
        run: node scripts/fetch_stocks.mjs

      - name: Publication des données
        run: |
          git config user.name "tradepilot-bot"
          git config user.email "actions@github.com"
          git add data/stocks.json
          if git diff --cached --quiet; then
            echo "Données inchangées, rien à publier."
          else
            git commit -m "🤖 Mise à jour des données boursières ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push origin HEAD:${{ github.ref_name }}
          fi

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Synchronisation avec les données fraîches
        run: git pull origin ${{ github.ref_name }}

      - name: Activation / configuration de GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
