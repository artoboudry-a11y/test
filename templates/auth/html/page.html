<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — MonApp</title>
  <!--
    TEMPLATE: Page de connexion / inscription
    - 100% HTML/CSS/JS vanilla, aucune dépendance
    - Basculer login ↔ register
    - Responsive, design épuré
    - Personnaliser : couleurs (--primary), textes, action du formulaire
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg: #f8fafc; --card: #fff; --border: #e2e8f0; --text: #0f172a; --muted: #64748b; --error: #dc2626; }
    body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #eef2ff, #fff, #faf5ff); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; color: var(--text); }
    .container { width: 100%; max-width: 420px; }
    .header { text-align: center; margin-bottom: 2rem; }
    .header .icon { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background: var(--primary); border-radius: 1rem; font-size: 2rem; margin-bottom: 1rem; box-shadow: 0 4px 14px rgba(79,70,229,.3); }
    .header h1 { font-size: 1.875rem; font-weight: 700; }
    .header p { color: var(--muted); margin-top: .25rem; }
    .card { background: var(--card); border-radius: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,.08); padding: 2rem; border: 1px solid var(--border); }
    .tabs { display: flex; background: #f1f5f9; border-radius: .75rem; padding: 4px; margin-bottom: 1.5rem; }
    .tabs button { flex: 1; padding: .6rem; border: none; background: none; border-radius: .6rem; font-size: .875rem; font-weight: 500; cursor: pointer; color: var(--muted); transition: all .2s; }
    .tabs button.active { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); color: var(--text); }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: .25rem; }
    .field input { width: 100%; padding: .75rem 1rem; border: 1px solid var(--border); border-radius: .75rem; font-size: 1rem; outline: none; transition: border .2s, box-shadow .2s; }
    .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: var(--error); padding: .75rem 1rem; border-radius: .75rem; font-size: .875rem; margin-bottom: 1rem; display: none; }
    .btn { width: 100%; padding: .75rem; background: var(--primary); color: #fff; border: none; border-radius: .75rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .divider { display: flex; align-items: center; gap: .75rem; margin: 1.5rem 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .divider span { font-size: .75rem; color: var(--muted); text-transform: uppercase; }
    .btn-oauth { width: 100%; padding: .75rem; border: 1px solid var(--border); border-radius: .75rem; background: #fff; font-size: .875rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .5rem; transition: background .2s; }
    .btn-oauth:hover { background: #f8fafc; }
    .footer { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">🔐</div>
      <h1>MonApp</h1>
      <p>Connectez-vous pour continuer</p>
    </div>
    <div class="card">
      <div class="tabs">
        <button id="tab-login" class="active" onclick="switchMode('login')">Connexion</button>
        <button id="tab-register" onclick="switchMode('register')">Inscription</button>
      </div>
      <form id="auth-form" onsubmit="handleSubmit(event)">
        <div id="name-field" class="field hidden">
          <label for="name">Nom</label>
          <input type="text" id="name" name="name" placeholder="Jean Dupont" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="vous@email.com" required />
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" />
        </div>
        <div id="error-msg" class="error"></div>
        <button type="submit" class="btn" id="submit-btn">Se connecter</button>
      </form>
      <div class="divider"><span>ou</span></div>
      <button class="btn-oauth" onclick="oauthLogin()">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continuer avec Google
      </button>
    </div>
    <p class="footer">© 2026 MonApp — Tous droits réservés</p>
  </div>

  <script>
    let mode = "login";
    function switchMode(m) {
      mode = m;
      document.getElementById("tab-login").classList.toggle("active", m === "login");
      document.getElementById("tab-register").classList.toggle("active", m === "register");
      document.getElementById("name-field").classList.toggle("hidden", m === "login");
      document.getElementById("submit-btn").textContent = m === "login" ? "Se connecter" : "Créer mon compte";
      document.getElementById("error-msg").style.display = "none";
    }
    function handleSubmit(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      console.log(mode, data);
      // ── À REMPLACER : votre logique d'auth ici ──
    }
    function oauthLogin() {
      // ── À REMPLACER : rediriger vers votre provider OAuth ──
      console.log("OAuth login");
    }
  </script>
</body>
</html>
